<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZMK KeyTester — 在线 ZMK 键盘测试器</title>
  <link rel="stylesheet" href="./styles.css?v=4" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Header -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-icon">⌨️</span>
        <div>
          <h1>ZMK KeyTester</h1>
          <p class="brand-sub" data-i18n="brandSub">读取 GitHub zmk-config 布局 · 实时按键亮起 · 系统键拦截</p>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="devices-wrap">
          <button id="connectHidBtn" type="button" class="btn btn-secondary btn-sm" data-i18n="connectHidBtn">
            识别 USB / 蓝牙键盘
          </button>
          <div id="devicesList" class="devices-list"></div>
        </div>

        <div class="lock-controls">
          <label class="switch-label" data-i18n-title="interceptTitle" title="开启后拦截浏览器与可捕获的系统按键">
            <input type="checkbox" id="interceptToggle" checked />
            <span data-i18n="interceptLabel">拦截按键</span>
          </label>
          <span id="lockBadge" class="lock-badge is-active" data-i18n="lockBadgeActive">浏览器按键拦截已启用</span>
          <button id="fullscreenLockBtn" type="button" class="btn btn-accent btn-sm" data-i18n="btnFullscreenEnter">
            全屏锁定系统键
          </button>
        </div>

        <div class="pref-controls">
          <button id="themeToggleBtn" type="button" class="btn btn-secondary btn-sm" title="切换亮色 / 暗色主题">
            ☀️ 亮色
          </button>
          <button id="langToggleBtn" type="button" class="btn btn-secondary btn-sm" title="Switch to English">
            中 / EN
          </button>
        </div>
      </div>
    </header>

    <!-- ZMK Config URL Loader Bar -->
    <section class="loader-bar">
      <div class="url-row">
        <input
          id="repoUrlInput"
          type="url"
          class="url-input"
          data-i18n-placeholder="urlPlaceholder"
          placeholder="输入 ZMK Config GitHub 链接，例如: https://github.com/username/zmk-config 或 .keymap 链接"
          spellcheck="false"
        />
        <button id="loadBtn" type="button" class="btn btn-primary" data-i18n="loadBtn">读取布局</button>
        <button id="loadDemoBtn" type="button" class="btn btn-secondary" data-i18n="loadDemoBtn">内置示例</button>
        <button id="advancedToggleBtn" type="button" class="btn btn-ghost" data-i18n="advancedBtn">更多方式 ▾</button>
      </div>

      <div class="preset-row">
        <span class="preset-title" data-i18n="presetTitle">快速预设:</span>
        <div id="presetBar" class="preset-bar"></div>
        <div id="keymapSelectWrap" class="keymap-select-wrap hidden">
          <span data-i18n="keymapSelectLabel">Keymap:</span>
          <select id="keymapSelect" class="select-input"></select>
        </div>
      </div>

      <div id="advancedPanel" class="advanced-panel hidden">
        <div class="adv-item">
          <label class="btn btn-secondary btn-sm file-btn">
            <span data-i18n="uploadFolderBtn">上传本地 zmk-config 文件夹</span>
            <input id="folderInput" type="file" webkitdirectory multiple hidden />
          </label>
          <label class="btn btn-secondary btn-sm file-btn">
            <span data-i18n="uploadFileBtn">选择 .keymap 文件</span>
            <input id="fileInput" type="file" accept=".keymap,.dtsi,.json" multiple hidden />
          </label>
          <button id="openRawModalBtn" type="button" class="btn btn-secondary btn-sm" data-i18n="pasteRawBtn">
            直接粘贴 .keymap 代码
          </button>
        </div>
        <div class="adv-item">
          <input
            id="tokenInput"
            type="password"
            class="token-input"
            data-i18n-placeholder="tokenPlaceholder"
            placeholder="可选: GitHub Token (私有仓库或突破 60次/时 限流)"
            autocomplete="off"
          />
        </div>
      </div>

      <div id="statusBanner" class="status-banner hidden"></div>
    </section>

    <!-- Workspace -->
    <main class="workspace">
      <section class="stage-panel">
        <!-- Toolbar above keyboard -->
        <div class="stage-toolbar">
          <div class="stage-title-wrap">
            <span class="stage-title-badge" data-i18n="physicalLayoutBadge">物理布局视图</span>
          </div>

          <div class="stage-options">
            <label class="check-label" data-i18n-title="soundTitle" title="识别到按键按下时发出嘟声提示，无需看屏幕">
              <input type="checkbox" id="soundToggle" checked />
              <span data-i18n="soundLabel">按键提示音</span>
            </label>
            <label class="check-label">
              <input type="checkbox" id="showIndicesToggle" />
              <span data-i18n="showIndicesLabel">显示键位编号</span>
            </label>
            <button id="resetTestedBtn" type="button" class="btn btn-ghost btn-sm" data-i18n="resetTestedBtn">重置测试进度</button>
          </div>
        </div>

        <!-- Keyboard Meta Stats -->
        <div class="meta-bar">
          <span id="metaRepo" class="meta-pill" data-i18n="metaRepoEmpty">未加载配置</span>
          <span id="metaLayout" class="meta-pill" data-i18n="metaLayoutEmpty">布局: -</span>
          <span id="metaCoverage" class="meta-pill is-highlight">已测试 0 / 0 (0%)</span>
        </div>

        <!-- Physical Keyboard Canvas -->
        <div id="keyboardStage" class="keyboard-stage">
          <div id="keyboardCanvas" class="keyboard-canvas"></div>
        </div>

        <!-- Active Modifiers Footer -->
        <div class="stage-footer">
          <div class="mods-wrap">
            <span class="mods-title" data-i18n="modsTitle">按住修饰键:</span>
            <div id="activeModsBar" class="active-mods-bar">
              <span class="muted" data-i18n="modsEmpty">当前无按住修饰键</span>
            </div>
          </div>
          <div id="lockHint" class="lock-hint"></div>
        </div>
      </section>

      <!-- Right Sidebar: Inspector & History -->
      <aside class="side-panel">
        <div class="side-card">
          <h3 data-i18n="inspectorTitle">按键详情</h3>
          <div id="inspectorCard" class="inspector-card">
            <div class="muted" data-i18n="inspectorEmpty">按下键盘按键，或点击布局上的按键查看详细 ZMK 绑定。</div>
          </div>
        </div>

        <div class="side-card side-log-card">
          <div class="side-card-head">
            <h3 data-i18n="eventLogTitle">按键记录</h3>
            <button id="clearLogBtn" type="button" class="btn btn-ghost btn-xs" data-i18n="clearLogBtn">清空</button>
          </div>
          <div id="eventLogList" class="event-log-list">
            <div class="muted" data-i18n="eventLogEmpty">等待按键输入...</div>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <!-- Raw Keymap Modal -->
  <div id="rawModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h3 data-i18n="rawModalTitle">粘贴 .keymap 内容</h3>
        <button id="closeRawModalBtn" type="button" class="btn btn-ghost btn-sm" data-i18n="rawModalClose">关闭</button>
      </div>
      <textarea
        id="rawKeymapText"
        class="raw-textarea"
        data-i18n-placeholder="rawTextareaPlaceholder"
        placeholder="在此粘贴完整的 ZMK .keymap 文件内容..."
      ></textarea>
      <div class="modal-actions">
        <button id="loadRawBtn" type="button" class="btn btn-primary" data-i18n="rawModalLoad">解析并显示</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/app.js?v=4"></script>
</body>
</html>
